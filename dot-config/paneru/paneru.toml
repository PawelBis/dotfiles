# basic .paneru.toml
[options]
auto_center = false
horizontal_mouse_warp = -1
horizontal_mouse_warp_offset = 700
focus_follows_mouse = false
mouse_follows_focus = false

# Cycle through these widths with window_resize binding
preset_column_widths = [0.25, 0.33, 0.50, 0.66, 0.75]

# Animation speed in pixels/second
animation_speed = 10

# Drop a virtual row as soon as its last window leaves.
# NOTE: this also means window_virtualnum_<n> can never create a row - an empty
# new row is despawned before you land on it. Rows are created by moving a
# window into them (window_virtualmove_south), which is the only flow used here.
reap_empty_workspaces = true

[restore]
enabled = true
startup_grace_ms = 15000
missing_windows = "ignore"

# 4-finger swipe: vertical switches virtual rows, horizontal scrolls the strip.
# 4 rather than 3 so the native macOS Spaces gesture is left alone.
[swipe.gesture]
fingers_count = 4
direction     = "Natural"
vertical      = true

[bindings]
# Focus along the strip (was cmd-h/l in AeroSpace)
window_focus_west  = "cmd - h"
window_focus_east  = "cmd - l"

# Swap/move windows along the strip (was alt-shift-h/l)
window_swap_west  = "alt + shift - h"
window_swap_east  = "alt + shift - l"

# Switch between virtual rows (was cmd-k/j focus north/south)
window_virtual_north = "cmd - k"
window_virtual_south = "cmd - j"

# Move focused window to the row above/below and follow it.
# Creates the row if it does not exist yet.
window_virtualmove_north = "alt + shift - k"
window_virtualmove_south = "alt + shift - j"

# Jump to first/last window on strip
window_focus_first = "cmd + shift - h"
window_focus_last  = "cmd + shift - l"

# Move to first/last position
window_swap_first = "alt + shift - u"
window_swap_last  = "alt + shift - o"

# Resize: cycle through preset_column_widths (was alt-shift-minus/equal)
window_resize = "alt + shift - equal"

# Toggle fullwidth (maximize horizontally)
window_fullwidth = "alt - f"

# Center current window on screen
window_center = "alt - c"

# Toggle window between managed (tiled) and floating (was cmd-t in AeroSpace)
window_manage = "cmd - t"

# Stack/unstack into left column
window_stack   = "alt - ]"
window_unstack = "alt + shift - ]"

# Move window to next display (was alt-shift-tab move-workspace-to-monitor)
window_nextdisplay = "alt - n"

# Quit Paneru
quit = "ctrl + alt - q"

# ---------------------------------------------------------------------------
# Window rules — floating apps (from AeroSpace on-window-detected rules)
# Paneru matches by bundle_id and/or title regex.
# ---------------------------------------------------------------------------

[windows.bitwarden_browser]
title = "Bitwarden"
bundle_id = "com.brave.Browser"
floating = true

[windows.bitwarden_app]
bundle_id = "com.bitwarden.desktop"
title = ".*"
floating = true

[windows.finder]
bundle_id = "com.apple.finder"
title = ".*"
floating = true

[windows.onepassword]
bundle_id = "com.1password.1password"
title = ".*"
floating = true

[windows.godot_debug]
bundle_id = "org.godotengine.godot"
title = "DEBUG"
floating = true

[windows.spotify]
bundle_id = "com.spotify.client"
title = ".*"
floating = true

[windows.zoom]
bundle_id = "us.zoom.xos"
title = ".*"
floating = true

[windows.insomnia]
bundle_id = "com.insomnia.app"
title = ".*"
floating = true

[windows.cloudflare]
bundle_id = "com.cloudflare.1dot1dot1dot1.macos"
title = ".*"
floating = true

[windows.pip]
title = "Picture.*(in)?.*[Pp]icture"
floating = true

# Global padding for all managed windows (approximates AeroSpace gaps)
[windows.all]
title = ".*"
horizontal_padding = 5
vertical_padding = 5
